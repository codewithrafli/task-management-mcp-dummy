# /etc/nginx/sites-available/task-management
# Ganti server_name & path root sesuai domainmu. Endpoint MCP (POST /mcp/task-management)
# dilayani seperti route Laravel biasa lewat php-fpm.

server {
    listen 80;
    server_name mcp.example.com;

    # Certbot akan mengelola blok 443; redirect HTTP -> HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name mcp.example.com;

    root /var/www/task-management/public;
    index index.php;

    # --- SSL (diisi/di-manage oleh Certbot) ---
    ssl_certificate     /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;

    # Header keamanan dasar
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;
    client_max_body_size 20M;

    # MCP streamable HTTP mengirim text/event-stream — jangan di-buffer.
    location = /mcp/task-management {
        try_files $uri /index.php?$query_string;

        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        include fastcgi_params;

        fastcgi_buffering off;
        fastcgi_read_timeout 300;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/task-management.access.log;
    error_log  /var/log/nginx/task-management.error.log;
}
